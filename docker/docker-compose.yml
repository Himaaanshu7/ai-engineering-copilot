services:

  postgres:
    image: postgres:16-alpine
    container_name: copilot_postgres
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot123
      POSTGRES_DB: copilot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: copilot_backend
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      POSTGRES_URL: postgresql+asyncpg://copilot:copilot123@postgres:5432/copilot_db
      BACKEND_URL: http://backend:8000
      CHROMA_PERSIST_DIR: /app/data/chroma
    volumes:
      - copilot_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: copilot_frontend
    ports:
      - "8501:8501"
    env_file:
      - ../.env
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  copilot_data:
    driver: local
